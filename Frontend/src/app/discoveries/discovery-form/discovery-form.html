<div class="page">
  <header>
    <h1>{{ isEditMode() ? 'Edit Discovery' : 'New Discovery' }}</h1>
  </header>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  @if (loading()) {
    <p class="loading">Loading…</p>
  } @else {
    <form class="form" (ngSubmit)="save()">
      @if (isEditMode()) {
        <div class="field">
          <span class="field-label">Lead</span>
          <p class="static-value">{{ leadLabel() ?? '—' }}</p>
        </div>
      } @else {
        <div class="field">
          <label for="lead">Lead *</label>
          <select
            id="lead"
            name="lead"
            required
            [ngModel]="form().lead_id"
            (ngModelChange)="update('lead_id', $event)"
          >
            <option value="" disabled>Select a lead…</option>
            @for (option of leadOptions(); track option.lead.id) {
              <option [value]="option.lead.id">
                {{ option.companyName }} — {{ option.contactName }}
              </option>
            }
          </select>
        </div>
      }

      <div class="field">
        <label for="problemStatement">Problem statement</label>
        <input
          id="problemStatement"
          name="problemStatement"
          type="text"
          [ngModel]="form().problem_statement"
          (ngModelChange)="update('problem_statement', $event)"
        />
      </div>

      <div class="field">
        <label for="currentSolution">Current solution</label>
        <input
          id="currentSolution"
          name="currentSolution"
          type="text"
          [ngModel]="form().current_solution"
          (ngModelChange)="update('current_solution', $event)"
        />
      </div>

      <div class="field">
        <label for="businessImpact">Business impact</label>
        <input
          id="businessImpact"
          name="businessImpact"
          type="text"
          [ngModel]="form().business_impact"
          (ngModelChange)="update('business_impact', $event)"
        />
      </div>

      <div class="field">
        <label for="successCriteria">Success criteria</label>
        <input
          id="successCriteria"
          name="successCriteria"
          type="text"
          [ngModel]="form().success_criteria"
          (ngModelChange)="update('success_criteria', $event)"
        />
      </div>

      @if (isEditMode()) {
        <div class="field">
          <label for="status">Status</label>
          <select
            id="status"
            name="status"
            [ngModel]="status()"
            (ngModelChange)="status.set($event)"
          >
            @for (s of statuses; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
        </div>
      }

      <div class="actions">
        <button type="submit" class="primary" [disabled]="saving() || !form().lead_id">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
        <a class="cancel" routerLink="/discoveries">Cancel</a>
      </div>
    </form>
  }
</div>
