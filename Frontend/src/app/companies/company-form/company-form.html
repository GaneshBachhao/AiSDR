<div class="page">
  <header>
    <h1>{{ isEditMode() ? 'Edit Company' : 'New Company' }}</h1>
  </header>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  @if (loading()) {
    <p class="loading">Loading…</p>
  } @else {
    <form class="form" (ngSubmit)="save()">
      <div class="field">
        <label for="name">Name *</label>
        <input
          id="name"
          name="name"
          type="text"
          required
          [ngModel]="form().name"
          (ngModelChange)="update('name', $event)"
        />
      </div>

      <div class="field">
        <label for="website">Website</label>
        <input
          id="website"
          name="website"
          type="text"
          [ngModel]="form().website"
          (ngModelChange)="update('website', $event)"
        />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="industry">Industry</label>
          <input
            id="industry"
            name="industry"
            type="text"
            [ngModel]="form().industry"
            (ngModelChange)="update('industry', $event)"
          />
        </div>

        <div class="field">
          <label for="companySize">Company size</label>
          <input
            id="companySize"
            name="companySize"
            type="text"
            [ngModel]="form().company_size"
            (ngModelChange)="update('company_size', $event)"
          />
        </div>

        <div class="field">
          <label for="employeeCount">Employee count</label>
          <input
            id="employeeCount"
            name="employeeCount"
            type="number"
            min="0"
            [ngModel]="form().employee_count"
            (ngModelChange)="update('employee_count', $event)"
          />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="country">Country</label>
          <input
            id="country"
            name="country"
            type="text"
            [ngModel]="form().country"
            (ngModelChange)="update('country', $event)"
          />
        </div>

        <div class="field">
          <label for="state">State</label>
          <input
            id="state"
            name="state"
            type="text"
            [ngModel]="form().state"
            (ngModelChange)="update('state', $event)"
          />
        </div>

        <div class="field">
          <label for="city">City</label>
          <input
            id="city"
            name="city"
            type="text"
            [ngModel]="form().city"
            (ngModelChange)="update('city', $event)"
          />
        </div>
      </div>

      <div class="actions">
        <button type="submit" [disabled]="saving() || !form().name">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
        <a class="cancel" routerLink="/companies">Cancel</a>
      </div>
    </form>
  }
</div>
