name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: Backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        # No AI provider credentials are configured in CI, and nothing here
        # should call one -- pytest exercises application/domain/infra code
        # against mocks and a local SQLite DB only.
        run: pytest -q
